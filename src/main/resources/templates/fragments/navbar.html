<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<nav th:fragment="navbar" class="matta-navbar">
  <div class="matta-navbar-inner">

    <!-- LOGO -->
    <a th:href="@{/}" class="matta-logo">🌿 MATTA</a>

    <!-- BUSCADOR -->
    <div class="matta-search">
      <input type="text" id="navSearchInput" placeholder="Buscar frutas, verduras, café…" autocomplete="off"/>
      <button onclick="navBuscar()">🔍</button>
    </div>

    <!-- LINKS escritorio -->
    <nav class="matta-nav-links">
      <a th:href="@{/productos/listar}" class="matta-nav-link">Productos</a>

      <!-- Si está logueado -->
      <th:block th:if="${session.usuario != null}">
        <a th:href="@{/usuarios/dashboard}" class="matta-nav-link">Mi Panel</a>
        <a th:href="@{/usuarios/logout}"    class="matta-nav-btn-out">Salir</a>
      </th:block>

      <!-- Si NO está logueado -->
      <th:block th:unless="${session.usuario != null}">
        <a th:href="@{/usuarios/login}"    class="matta-nav-link">Ingresar</a>
        <a th:href="@{/usuarios/registro}" class="matta-nav-btn">Registrarse</a>
      </th:block>
    </nav>

    <!-- Botón hamburguesa móvil -->
    <button class="matta-hamburger" onclick="toggleMobileMenu()" aria-label="Menú">☰</button>
  </div>

  <!-- Menú móvil -->
  <div class="matta-mobile-menu" id="mobileMenu">
    <a th:href="@{/productos/listar}">🥦 Productos</a>
    <th:block th:if="${session.usuario != null}">
      <a th:href="@{/usuarios/dashboard}">📊 Mi panel</a>
      <a th:href="@{/usuarios/logout}">🚪 Salir</a>
    </th:block>
    <th:block th:unless="${session.usuario != null}">
      <a th:href="@{/usuarios/login}">🔑 Ingresar</a>
      <a th:href="@{/usuarios/registro}" style="color:var(--matta-lima)!important;font-weight:700;">✅ Registrarse gratis</a>
    </th:block>
  </div>
</nav>

<script>
  function navBuscar() {
    const q = document.getElementById('navSearchInput')?.value.trim();
    if (q) window.location.href = '/productos/listar?q=' + encodeURIComponent(q);
  }
  document.addEventListener('DOMContentLoaded', function() {
    const inp = document.getElementById('navSearchInput');
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') navBuscar(); });
  });
  function toggleMobileMenu() {
    document.getElementById('mobileMenu')?.classList.toggle('open');
  }
</script>

</body>
</html>
