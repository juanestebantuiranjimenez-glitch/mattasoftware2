<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto - MATTA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/matta.css}"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h3 class="mb-0">Editar Producto</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/productos/actualizar}" method="post" enctype="multipart/form-data">
                            <!-- ID Producto (necesario para actualizar) -->
                            <input type="hidden" name="id_producto" th:value="${producto.id_producto}"/>
                            
                            <div class="mb-3">
                                <label class="form-label">Nombre del Producto</label>
                                <input type="text" name="nombre" class="form-control" th:value="${producto.nombre}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea name="descripcion" class="form-control" rows="3" th:text="${producto.descripcion}"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Precio</label>
                                    <input type="number" name="precio" class="form-control" step="0.01" th:value="${producto.precio}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Cantidad Disponible</label>
                                    <input type="number" name="cantidad_disponible" class="form-control" th:value="${producto.cantidad_disponible}" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Foto del Producto (dejar en blanco para mantener actual)</label>
                                <input type="file" name="file" class="form-control" accept="image/*">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Guardar Cambios</button>
                            <a th:href="@{/usuarios/dashboard}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
