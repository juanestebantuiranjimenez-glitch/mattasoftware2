<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tienda MATTA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card { transition: transform 0.2s; }
        .product-card:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-success fw-bold">Productos del Campo</h1>
            <a th:href="@{/productos/nuevo}" class="btn btn-success">+ Subir Producto</a>
        </div>

        <!-- Aquí empieza la cuadrícula de tarjetas -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <!-- th:each recorre la lista y crea una tarjeta por cada producto -->
            <div class="col" th:each="p : ${listaProductos}">
                <div class="card h-100 shadow-sm product-card">
                    <!-- Imagen de prueba (luego la cambiaremos por la real) -->
                    <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=500" 
                         class="card-img-top" alt="Producto" style="height: 200px; object-fit: cover;">
                    
                    <div class="card-body">
                        <h5 class="card-title fw-bold" th:text="${p.nombre}">Nombre</h5>
                        <p class="card-text text-muted" th:text="${p.descripcion}">Descripción corta del producto.</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="h5 text-success mb-0" th:text="'$' + ${p.precio}">$0.00</span>
                            <span class="badge bg-info text-dark" th:text="${p.cantidad_disponible} + ' disp.'">10 disp.</span>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-top-0 pb-3">
                        <button class="btn btn-outline-success w-100">Añadir al Carrito</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
