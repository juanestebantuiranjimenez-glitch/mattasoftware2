<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Pago Exitoso! — MATTA</title>
  <link rel="stylesheet" th:href="@{/css/matta.css}" />
</head>

<body style="background:var(--crema); display:flex; align-items:center; justify-content:center; min-height:100vh;">

  <div
    style="background:white; border-radius:var(--radio-md); border:1px solid var(--borde); padding:48px 32px; text-align:center; max-width:500px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);">

    <div style="font-size:4rem; margin-bottom:16px;">🎉</div>
    <h1 style="font-size:1.8rem; color:var(--verde-oscuro); margin-bottom:12px;">¡Tu pedido está confirmado!</h1>

    <p style="color:var(--texto-gris); margin-bottom:32px; line-height:1.6;">
      Gracias por apoyar a nuestros campesinos. Hemos recibido tu pedido y pronto nos pondremos en contacto contigo para
      coordinar la entrega.
    </p>

    <div
      style="background:#f0fdf4; border:1px dashed var(--verde-suave); border-radius:8px; padding:16px; margin-bottom:32px;">
      <p style="font-weight:700; color:var(--verde-oscuro); margin-bottom:4px;">Número de Pedido</p>
      <p style="font-size:1.2rem; letter-spacing:2px; font-family:monospace; color:var(--verde-suave);">#<span
          th:text="${#strings.randomAlphanumeric(8).toUpperCase()}">MATTA-1234</span></p>
    </div>

    <div style="display:flex; gap:16px;">
      <a th:href="@{/productos}" class="btn-secondary" style="flex:1; justify-content:center;">Seguir comprando</a>
      <a th:href="@{/dashboard}" class="btn-primary" style="flex:1; justify-content:center;">Ir a mi panel</a>
    </div>

  </div>

</body>

</html>
