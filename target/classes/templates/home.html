<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MATTA - Bienvenidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container text-center mt-5">
        <div class="p-5 mb-4 bg-light rounded-3 shadow">
            <h1 class="display-5 fw-bold text-success">Del campo a tu mesa</h1>
            <p class="fs-4">Conectamos directamente a campesinos con restaurantes y hogares.</p>
            <hr class="my-4">
            <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                <a th:href="@{/productos/listar}" class="btn btn-success btn-lg px-4">Ir a la Tienda</a>
                <a th:href="@{/usuarios/registro}" class="btn btn-outline-secondary btn-lg px-4">Unirme como Campesino</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
