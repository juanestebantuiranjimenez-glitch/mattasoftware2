<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Perfil — MATTA</title>
  <link rel="stylesheet" th:href="@{/css/matta.css}"/>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-logo">🌿 MATTA</a>
    <div style="flex:1;"></div>
    <nav class="navbar-nav">
      <a th:href="@{/productos}" class="nav-link">Productos</a>
      <th:block th:if="${session.usuario != null}">
        <a th:href="@{/usuarios/dashboard}" class="nav-link">Mi Panel</a>
      </th:block>
      <a th:href="@{/usuarios/logout}" class="nav-btn">Salir</a>
    </nav>
  </div>
</nav>

<div style="max-width: 600px; margin: 40px auto; padding: 0 20px;">
  <h2 style="font-size: 1.8rem; color: var(--verde-oscuro); margin-bottom: 20px;">👤 Mi Perfil</h2>

  <!-- Mensajes -->
  <div th:if="${mensaje}"
       style="background:#d1fae5;color:#065f46;border-radius:var(--radio-sm);padding:12px 16px;font-size:0.88rem;margin-bottom:20px;">
    ✅ <span th:text="${mensaje}">Mensaje</span>
  </div>
  <div th:if="${error}"
       style="background:#fee2e2;color:#b91c1c;border-radius:var(--radio-sm);padding:12px 16px;font-size:0.88rem;margin-bottom:20px;">
    ⚠️ <span th:text="${error}">Error</span>
  </div>

  <div class="form-card" style="background: white; padding: 30px; border-radius: var(--radio-lg); box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    <form th:action="@{/usuarios/perfil}" method="post">
      <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-group">
        <label>Tipo de Usuario</label>
        <input type="text" th:value="${session.usuario.rol}" disabled style="background: #f3f4f6;" />
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="text" th:value="${session.usuario.correo}" disabled style="background: #f3f4f6;" />
      </div>

      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" th:value="${session.usuario.nombre}" required/>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" name="telefono" th:value="${session.usuario.telefono}"/>
      </div>

      <div class="form-group" th:if="${session.usuario.rol == 'CAMPESINO'}">
        <label for="ubicacion">Ubicación (Vereda / Municipio)</label>
        <input type="text" id="ubicacion" name="ubicacion" th:value="${session.usuario.ubicacion}" required/>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--borde); margin: 20px 0;"/>

      <h3 style="font-size: 1.2rem; color: var(--texto-oscuro); margin-bottom: 15px;">Cambiar Contraseña</h3>
      <p style="font-size: 0.85rem; color: var(--texto-gris); margin-bottom: 15px;">Deja en blanco si no deseas cambiarla.</p>

      <div class="form-group">
        <label for="passwordActual">Contraseña Actual</label>
        <input type="password" id="passwordActual" name="passwordActual" placeholder="Tu contraseña actual"/>
      </div>

      <div class="form-group">
        <label for="nuevaPassword">Nueva Contraseña</label>
        <input type="password" id="nuevaPassword" name="nuevaPassword" placeholder="Mínimo 6 caracteres" minlength="6"/>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
        Guardar Cambios
      </button>
    </form>
  </div>
</div>

</body>
</html>
