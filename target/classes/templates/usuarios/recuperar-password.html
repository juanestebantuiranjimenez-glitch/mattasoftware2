<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar Contraseña — MATTA</title>
  <link rel="stylesheet" th:href="@{/css/matta.css}"/>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <a th:href="@{/}" style="display:inline-block;">
        <div class="logo-text">🌿 MATTA</div>
      </a>
      <p>Recuperar Contraseña</p>
    </div>

    <div>
      <div th:if="${error}" style="background:#fee2e2;color:#b91c1c;border-radius:8px;padding:10px 14px;font-size:0.85rem;margin-bottom:16px;">
        ⚠️ <span th:text="${error}">Error</span>
      </div>
      <div th:if="${exito}" style="background:#d1fae5;color:#065f46;border-radius:8px;padding:10px 14px;font-size:0.85rem;margin-bottom:16px;">
        ✅ <span th:text="${exito}">Éxito</span>
      </div>

      <form th:action="@{/usuarios/recuperar-password}" method="post" id="form-recuperar">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
          <label for="correo">Correo electrónico registrado</label>
          <input type="email" id="correo" name="correo" placeholder="tucorreo@email.com" required autocomplete="email"/>
        </div>

        <div class="form-group">
          <label for="nuevaPassword">Nueva contraseña</label>
          <input type="password" id="nuevaPassword" name="nuevaPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password"/>
        </div>

        <div class="form-group">
          <label for="nuevaPassword2">Confirmar nueva contraseña</label>
          <input type="password" id="nuevaPassword2" name="nuevaPassword2" placeholder="Repite tu contraseña" required autocomplete="new-password"/>
        </div>

        <div id="error-password" style="display:none;color:#b91c1c;font-size:0.8rem;margin-bottom:12px;">
          ⚠️ Las contraseñas no coinciden
        </div>

        <button type="button" class="btn-full" onclick="validarYEnviar()">Cambiar Contraseña</button>
      </form>

      <p style="text-align:center;margin-top:18px;font-size:0.85rem;color:var(--texto-gris);">
        <a th:href="@{/usuarios/login}" style="color:var(--verde-suave);font-weight:600;">Volver a Ingresar</a>
      </p>
    </div>

  </div>
</div>

<script>
  function validarYEnviar() {
    const p1 = document.getElementById('nuevaPassword').value;
    const p2 = document.getElementById('nuevaPassword2').value;
    const err = document.getElementById('error-password');
    if (p1 !== p2) {
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    document.getElementById('form-recuperar').submit();
  }
</script>

</body>
</html>
