<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - MATTA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Crear Cuenta</h2>
                        <form th:action="@{/usuarios/registro}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Nombre Completo</label>
                                <input type="text" name="nombre" class="form-control" required shadow-sm>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Correo</label>
                                <input type="email" name="correo" class="form-control" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Contraseña</label>
                                    <input type="password" name="contrasena" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Tipo de Usuario</label>
                                    <select name="tipo_usuario" class="form-select">
                                        <option value="Cliente">Soy Cliente / Restaurante</option>
                                        <option value="Campesino">Soy Campesino / Productor</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100 mt-3">Registrarme</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
